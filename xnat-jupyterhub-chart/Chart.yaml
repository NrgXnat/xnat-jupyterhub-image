apiVersion: v2
name: jupyterhub-xnat
description: Helm xnat-jupyterhub-chart for deploying JupyterHub (and PostgreSQL) for an XNAT instance
type: application
version: 0.1.4
appVersion: "1.3.4"

# In addition to the following helm dependencies, this chart requires the following operator to be pre-installed to install Postgres with the chart:
#
# 1. CloudNativePG operator (for PostgreSQL):
#    helm repo add cnpg https://cloudnative-pg.github.io/charts
#    helm install cnpg-operator cnpg/cloudnative-pg
#    Full documentation: https://cloudnative-pg.io/documentation/

dependencies:
- name: jupyterhub
  version: "3.2.1" # jupyterhub app version 4.0.2
  repository: "https://hub.jupyter.org/helm-chart/"
  condition: jupyterhub.enabled
